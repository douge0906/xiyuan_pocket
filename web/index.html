<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="无锡学院校园助手（Web/PWA 测试版）">
  <meta name="theme-color" content="#1F2937">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="掌上锡院">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>掌上锡院</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 首屏加载占位：Flutter 引擎就绪前展示，首帧后由脚本移除。
       配色对齐安卓启动页（launch_bg #F8F9FC + 主色 #1F2937），避免首帧深浅跳变。
       纯内联 HTML/CSS，仅 Web 构建使用，不影响安卓端。 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F9FC;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F8F9FC;
      z-index: 99999;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      animation: app-loader-fade-in 0.25s ease-out;
    }
    .loader-logo {
      width: 132px;
      height: 132px;
      border-radius: 32px;
      box-shadow: 0 10px 32px rgba(31, 41, 55, 0.20);
    }
    .loader-ring {
      width: 34px;
      height: 34px;
      border: 3px solid #E5E7EB;
      border-top-color: #1F2937;
      border-radius: 50%;
      animation: app-loader-spin 0.9s linear infinite;
    }
    .loader-title {
      color: #1F2937;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .loader-sub {
      color: #6B7280;
      font-size: 13px;
      letter-spacing: 1px;
    }
    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes app-loader-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <img class="loader-logo" src="icons/Icon-192.png" alt="">
    <div class="loader-ring"></div>
    <div class="loader-title">掌上锡院</div>
    <div class="loader-sub">正在加载…</div>
  </div>
  <script>
    // 首帧渲染后移除占位；兜底 10 秒强制移除，避免异常时卡死白屏。
    (function () {
      var el = document.getElementById('app-loading');
      function hide() { if (el) { el.remove(); el = null; } }
      window.addEventListener('flutter-first-frame', hide, { once: true });
      setTimeout(hide, 10000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
