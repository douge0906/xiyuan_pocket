name: Release

# 打 tag（形如 v1.0.1）时自动构建并发布 Release。
# 相比 artifact 的好处：公开可下载（无需登录）、永久保留、有版本列表与更新说明。
#
# 发版流程（维护者）：
#   1. 改 pubspec.yaml 的 version:（如 1.0.1+2）
#   2. git commit -am "release: v1.0.1"
#   3. git tag v1.0.1 && git push && git push --tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 也可手动触发（用当前分支构建）

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（Flutter 3.24 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter（与项目锁定版本一致）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 把 Gradle 下载源切回官方（仅 CI）
        # 仓库里配的是腾讯云镜像（国内本地构建快），runner 在国外取不到
        run: |
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze lib

      - name: 单元测试
        run: flutter test

      - name: 构建 release APK（arm64）
        run: flutter build apk --release --target-platform android-arm64

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 幂等：同名 Release 已存在时先删掉再建。
          # 重写历史 / 重打同名 tag 后必须这样，否则 gh release create 会报 already exists。
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "掌上锡院 ${{ github.ref_name }}" \
            --generate-notes
